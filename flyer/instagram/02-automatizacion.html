<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;background:#050505}
body{font-family:'Sora',sans-serif;color:#F7F7F7;position:relative;overflow:hidden;padding:72px 72px 64px;display:flex;flex-direction:column}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at 80% 0%,#000 0%,transparent 70%)}
.glow{position:absolute;top:-260px;right:-220px;width:700px;height:700px;background:radial-gradient(circle,rgba(196,255,0,.22),transparent 65%)}
.z{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:0;font-weight:800;font-size:40px;letter-spacing:-1.5px}
.brand img{width:96px;height:96px;margin:-24px -14px -24px -24px;object-fit:contain}
.brand span{color:#C4FF00}
.tag{font-family:'IBM Plex Mono',monospace;font-size:17px;color:#A6A6A6;letter-spacing:3px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:19px;color:#C4FF00;letter-spacing:4px;margin-top:56px}
h1{font-weight:800;font-size:88px;line-height:.98;letter-spacing:-4px;text-transform:uppercase;margin-top:18px}
h1 em{font-style:normal;color:#C4FF00}
.lead{font-size:23px;line-height:1.5;color:#A6A6A6;margin-top:24px;max-width:860px}
.cards{display:flex;flex-direction:column;gap:20px;margin-top:40px}
.card{position:relative;border:1px solid rgba(255,255,255,.08);background:#0B0B0B;border-radius:26px;padding:28px 34px;display:grid;grid-template-columns:330px 1fr;gap:30px;align-items:center}
.card:before{content:"";position:absolute;left:0;top:28px;bottom:28px;width:4px;background:#C4FF00;border-radius:0 4px 4px 0}
.id{font-family:'IBM Plex Mono',monospace;font-size:16px;color:#C4FF00;letter-spacing:3px}
.card h2{font-weight:800;font-size:27px;line-height:1.1;letter-spacing:-.5px;text-transform:uppercase;margin:10px 0 10px}
.card p{font-size:16px;line-height:1.45;color:#A6A6A6}
ul{list-style:none;display:grid;gap:13px;border-left:1px solid rgba(255,255,255,.08);padding-left:30px}
li{font-size:21px;font-weight:600;display:flex;gap:12px;align-items:baseline;line-height:1.2}
li:before{content:"›";color:#C4FF00;font-weight:800}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.1);padding-top:30px}
.cta{background:#C4FF00;color:#050505;font-weight:800;font-size:25px;padding:20px 34px;border-radius:999px;letter-spacing:-.3px}
.contact{font-family:'IBM Plex Mono',monospace;font-size:20px;line-height:1.7;text-align:right}
.contact b{color:#C4FF00;font-weight:500}

body{padding:72px}
.mid{margin:auto 0}
.k{font-family:'IBM Plex Mono',monospace;font-size:21px;color:#C4FF00;letter-spacing:4px}
h1.big{font-size:96px;line-height:1;letter-spacing:-4.5px;margin-top:26px}
.sub{font-size:31px;line-height:1.45;color:#A6A6A6;margin-top:34px;max-width:900px}
.sub b{color:#F7F7F7;font-weight:600}
.items{display:grid;gap:18px;margin-top:44px}
.it{border:1px solid rgba(255,255,255,.08);background:#0B0B0B;border-radius:24px;padding:26px 32px 26px 40px;font-size:30px;font-weight:600;line-height:1.25;position:relative}
.it:before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:4px;background:#C4FF00;border-radius:0 4px 4px 0}
.it small{display:block;font-size:22px;font-weight:400;color:#A6A6A6;margin-top:6px}
.n{font-family:'IBM Plex Mono',monospace;color:#C4FF00;font-size:22px;letter-spacing:3px;display:block;margin-bottom:6px}
.foot{padding-top:28px}
.foot .l{font-family:'IBM Plex Mono',monospace;font-size:20px;color:#A6A6A6}
.foot .l b{color:#C4FF00;font-weight:500}
.pill{background:#C4FF00;color:#050505;font-weight:800;font-size:24px;padding:16px 30px;border-radius:999px}
.tag{font-size:16px}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="z top"><div class="brand"><img src="../logo.png"><div>korsen<span>.dev</span></div></div></div>
<div class="z mid"><div class="k">// AHORRA TIEMPO</div><h1 class="big">¿Todavía haces todo <em>a mano?</em></h1><p class="sub">Pasar datos de un lado a otro, responder lo mismo cada día, armar reportes... <b>Eso puede hacerse solo.</b></p><div class="items"><div class="it">Menos tareas repetitivas</div><div class="it">Menos errores humanos</div><div class="it">Más tiempo para lo que importa</div></div></div>
<div class="z foot"><div class="pill">Automatiza tu negocio →</div><div class="l"><b>korsen.dev</b><br>team@korsen.dev</div></div>
</body></html>
